name: iOS MVP

on:
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: Export new iOS walkthrough baselines instead of comparing them
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - apps/ios/**
      - tests/e2e/004-ios-respond-to-dose/**
      - .github/workflows/ios.yml
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - tests/e2e/004-ios-respond-to-dose/**
      - .github/workflows/ios.yml

permissions:
  contents: read

jobs:
  build-and-test:
    name: Core checks and iOS build
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Create normalized simulator
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          device_id="$(xcrun simctl create \
            'MediNag E2E' \
            'com.apple.CoreSimulator.SimDeviceType.iPhone-17' \
            'com.apple.CoreSimulator.SimRuntime.iOS-26-2')"
          echo "MEDINAG_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl ui "$device_id" appearance light
          xcrun simctl status_bar "$device_id" override \
            --time '9:41' \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4

      - name: Run deterministic core checks
        run: npm run ios:core:check

      - name: Generate Xcode project
        run: npm run ios:generate

      - name: Build app and test bundles
        run: |
          xcodebuild build-for-testing \
            -project apps/ios/MediNag.xcodeproj \
            -scheme MediNag \
            -configuration E2E \
            -destination "platform=iOS Simulator,id=$MEDINAG_SIMULATOR_ID" \
            -derivedDataPath apps/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project apps/ios/MediNag.xcodeproj \
            -scheme MediNag \
            -configuration E2E \
            -destination "platform=iOS Simulator,id=$MEDINAG_SIMULATOR_ID" \
            -derivedDataPath apps/ios/DerivedData \
            -only-testing:MediNagTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS user-story walkthrough
        run: |
          xcodebuild test-without-building \
            -project apps/ios/MediNag.xcodeproj \
            -scheme MediNag \
            -configuration E2E \
            -destination "platform=iOS Simulator,id=$MEDINAG_SIMULATOR_ID" \
            -derivedDataPath apps/ios/DerivedData \
            -only-testing:MediNagUITests/RespondToDoseUITests/testSteveSnoozesThenCompletesScheduledDose \
            -resultBundlePath apps/ios/DerivedData/MediNagUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export XCTest attachments
        if: always()
        run: |
          mkdir -p apps/ios/DerivedData/MediNagUITestAttachments
          xcrun xcresulttool export attachments \
            --path apps/ios/DerivedData/MediNagUITests.xcresult \
            --output-path apps/ios/DerivedData/MediNagUITestAttachments

      - name: Materialize walkthrough screenshots
        if: always()
        run: |
          apps/ios/scripts/export-walkthrough.sh \
            apps/ios/DerivedData/MediNagUITestAttachments \
            apps/ios/DerivedData/ActualWalkthrough

      - name: Enforce zero-pixel tolerance
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.record_screenshots) }}
        run: |
          swift apps/ios/scripts/compare-walkthrough.swift \
            tests/e2e/004-ios-respond-to-dose/screenshots/ios \
            apps/ios/DerivedData/ActualWalkthrough/screenshots/ios

      - name: Upload reviewable iOS walkthrough
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.record_screenshots && 'ios-walkthrough-recording' || 'ios-walkthrough-actual' }}
          path: |
            apps/ios/DerivedData/ActualWalkthrough/
            apps/ios/DerivedData/MediNagUITestAttachments/
            apps/ios/DerivedData/MediNagUITests.xcresult/
          if-no-files-found: error
          retention-days: 7

      - name: Delete simulator
        if: always()
        run: xcrun simctl delete "$MEDINAG_SIMULATOR_ID"
