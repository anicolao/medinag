name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: Admin dashboard walkthrough
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Validate Firebase configuration
        run: npm run firebase:validate

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Check types
        run: npm run check

      - name: Build dashboard
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  ios:
    name: Core checks and iOS build
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Confirm toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Run deterministic core checks
        run: npm run ios:core:check

      - name: Generate Xcode project
        run: npm run ios:generate

      - name: Build app and test bundles
        run: |
          xcodebuild build-for-testing \
            -project apps/ios/MediNag.xcodeproj \
            -scheme MediNag \
            -configuration E2E \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -derivedDataPath apps/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project apps/ios/MediNag.xcodeproj \
            -scheme MediNag \
            -configuration E2E \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -derivedDataPath apps/ios/DerivedData \
            -only-testing:MediNagTests \
            CODE_SIGNING_ALLOWED=NO
