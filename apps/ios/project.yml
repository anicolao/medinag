name: MediNag

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  E2E: debug
  Release: release

packages:
  MediNagCore:
    path: Core
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.17.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.2.0

targets:
  MediNag:
    type: application
    platform: iOS
    sources:
      - path: MediNag
        excludes:
          - Resources/GoogleService-Info.plist
    configFiles:
      Debug: Config/Debug.xcconfig
      E2E: Config/E2E.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MediNag/Info.plist
        PRODUCT_NAME: MediNag
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: MediNagCore
        product: MediNagCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    postBuildScripts:
      - name: Embed local Firebase configuration
        basedOnDependencyAnalysis: false
        script: |
          configuration="$PROJECT_DIR/MediNag/Resources/GoogleService-Info.plist"
          if [ -f "$configuration" ]; then
            destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            mkdir -p "$destination"
            cp "$configuration" "$destination/GoogleService-Info.plist"

            reversed_client_id="$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' "$configuration")"
            case "$reversed_client_id" in
              *[!A-Za-z0-9.-]*|'')
                echo "GoogleService-Info.plist contains an invalid reversed client ID." >&2
                exit 1
                ;;
            esac
            product_info="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c 'Delete :CFBundleURLTypes' "$product_info" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes array' "$product_info"
            /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0 dict' "$product_info"
            /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor' "$product_info"
            /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes array' "$product_info"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $reversed_client_id" "$product_info"
          fi

  MediNagTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MediNagTests
    configFiles:
      Debug: Config/Debug.xcconfig
      E2E: Config/E2E.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: org.boardgamescafe.medinag.tests
    dependencies:
      - target: MediNag
      - package: MediNagCore
        product: MediNagCore

  MediNagUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MediNagUITests
    configFiles:
      Debug: Config/Debug.xcconfig
      E2E: Config/E2E.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MediNagUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.boardgamescafe.medinag.uitests
        TEST_TARGET_NAME: MediNag
    dependencies:
      - target: MediNag

schemes:
  MediNag:
    build:
      targets:
        MediNag: all
        MediNagTests: [test]
        MediNagUITests: [test]
    run:
      config: Debug
    test:
      config: E2E
      gatherCoverageData: true
      targets:
        - MediNagTests
        - MediNagUITests
    archive:
      config: Release
